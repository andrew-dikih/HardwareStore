name: CI - Tests and Coverage

on:
  pull_request:
    branches:
      - main
      - develop
    # Passive-documentation boundary: skip CI entirely (zero runner minutes)
    # for pull requests that ONLY touch Markdown docs outside automation,
    # deployable-output, and legal/metadata surfaces. Any diff containing at
    # least one non-listed file still runs full CI (paths-ignore only skips
    # when EVERY changed file matches). See .github/DOCS_ONLY_CI_POLICY.md
    # for the full rationale, the required-status-check caveat, and the
    # >=3,000-changed-files limitation this boundary does not attempt to
    # override.
    paths-ignore:
      - '**/*.md'
      - '!.github/**'
      - '!**/public/**'
      - '!**/wwwroot/**'
      - '!**/dist/**'
      - '!**/build/**'
      - '!**/bin/**'
      - '!**/obj/**'
      - '!LICENSE'
      - '!LICENSE.md'
      - '!LICENSE.txt'
  # Manual escape hatch: lets a maintainer get a real, reported "Unit Tests" /
  # "Integration Tests" status on demand (e.g. to unblock a required check
  # that is legitimately pending after a docs-only skip, without bypassing
  # branch protection blindly). See .github/DOCS_ONLY_CI_POLICY.md.
  workflow_dispatch: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/HardwareStore.UnitTests/HardwareStore.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Check coverage threshold
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.opencover.xml
          targetdir: coverage/report
          reporttypes: TextSummary
          verbosity: Warning

      - name: Enforce 70% coverage
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/report/Summary.txt || echo "0")
          echo "Line coverage: $COVERAGE%"
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage $COVERAGE% is below the required $THRESHOLD%"
            exit 1
          fi
          echo "Coverage check passed: $COVERAGE% >= $THRESHOLD%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/HardwareStore.IntegrationTests/HardwareStore.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: test-results
