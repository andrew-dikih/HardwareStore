name: CI - Tests and Coverage

# Passive-docs gating: PRs that ONLY touch the paths below (README/LICENSE/docs)
# never trigger this workflow, so they consume zero GitHub-hosted runner minutes.
# `paths-ignore` skips the run only when *every* changed file matches one of
# these patterns (a "three-dot diff" for pull requests) - a single file outside
# this list (including anything under .github/, src/, or tests/) still runs the
# full suite. See .github/copilot-instructions.md#ci-docs-only-automation-gating
# for the full boundary definition, the GitHub 3,000-file evaluation limit, and
# the manual-override procedure for branch-protection-required-check edge cases.
on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  # Manual escape hatch: lets a maintainer independently validate this
  # pipeline against a chosen branch/ref (e.g. a change GitHub could not
  # classify because it touched >=3,000 files - see comment above). This
  # does NOT attach a status to any pull request head, so it can never
  # satisfy or unstick a PR's required "Unit Tests"/"Integration Tests"
  # check that is stuck "pending" due to a skipped run - see
  # copilot-instructions.md#ci-docs-only-automation-gating.
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/HardwareStore.UnitTests/HardwareStore.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Check coverage threshold
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.opencover.xml
          targetdir: coverage/report
          reporttypes: TextSummary
          verbosity: Warning

      - name: Enforce 70% coverage
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/report/Summary.txt || echo "0")
          echo "Line coverage: $COVERAGE%"
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage $COVERAGE% is below the required $THRESHOLD%"
            exit 1
          fi
          echo "Coverage check passed: $COVERAGE% >= $THRESHOLD%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/HardwareStore.IntegrationTests/HardwareStore.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: test-results
