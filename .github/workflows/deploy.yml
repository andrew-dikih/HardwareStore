name: CD - Deploy to Azure

on:
  push:
    branches:
      - main
    # Passive-documentation boundary: mirrors ci.yml's pull_request filter so
    # a docs-only push to main never triggers a deploy. Any diff containing
    # at least one non-listed file still deploys (paths-ignore only skips
    # when EVERY changed file matches). See .github/DOCS_ONLY_CI_POLICY.md.
    paths-ignore:
      - '**/*.md'
      - '!.github/**'
      - '!**/public/**'
      - '!**/wwwroot/**'
      - '!**/dist/**'
      - '!**/build/**'
      - '!**/bin/**'
      - '!**/obj/**'
      - '!LICENSE'
      - '!LICENSE.md'
      - '!LICENSE.txt'

env:
  # TODO: Fill in your Azure configuration values and add corresponding secrets
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}            # Azure Web App name
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}      # Azure resource group
  DOTNET_VERSION: '8.0.x'
  PUBLISH_DIR: './publish'

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/HardwareStore.UnitTests/HardwareStore.UnitTests.csproj \
            --no-build \
            --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/HardwareStore.IntegrationTests/HardwareStore.IntegrationTests.csproj \
            --no-build \
            --configuration Release

      - name: Publish API
        run: |
          dotnet publish src/HardwareStore.Api/HardwareStore.Api.csproj \
            --configuration Release \
            --output ${{ env.PUBLISH_DIR }}

      - name: Set artifact name
        id: set-artifact
        run: echo "name=hardwarestore-api-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    permissions: {}
    environment:
      name: production
      # TODO: Set the URL to your deployed web app after configuring Azure
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.PUBLISH_DIR }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          # TODO: Add AZURE_CREDENTIALS secret to repository secrets
          # Generate with: az ad sp create-for-rbac --name "HardwareStore-Deploy" --role contributor \
          #   --scopes /subscriptions/<subscription-id>/resourceGroups/<resource-group> --json-auth
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # TODO: Add AZURE_WEBAPP_PUBLISH_PROFILE secret to repository secrets (optional alternative to AZURE_CREDENTIALS)
          # publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Verify deployment
        run: |
          echo "Deployment complete."
          echo "App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          # TODO: Add health check once app URL is known, e.g.:
          # curl --fail https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health
