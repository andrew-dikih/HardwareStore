name: CD - Deploy to Azure

# Passive-docs gating: a push that ONLY touches README/LICENSE/docs never
# triggers a deployment. `paths-ignore` skips the run only when *every*
# changed file (two-dot diff for pushes) matches one of these patterns; any
# other file (including anything under .github/, src/, tests/, or config/infra)
# still runs the full build-and-push-and-deploy pipeline. This boundary is
# intentionally identical to ci.yml's - see
# .github/copilot-instructions.md#ci-docs-only-automation-gating for the full
# definition and the GitHub 3,000-file evaluation limit.
#
# Note: unlike ci.yml, none of this workflow's jobs ("Build and Push Docker
# Images", "Deploy to Azure Container Apps") are configured as required status
# checks in branch protection, so skipping this workflow entirely for
# docs-only pushes carries no "stuck pending check" risk.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  # Manual escape hatch: lets a maintainer manually validate/dispatch a
  # deployment GitHub could not classify (>=3,000 changed files) instead of
  # relying on the automatic path-filter skip. Note this only lets you
  # re-run/validate the pipeline against a chosen ref - it does not attach a
  # required status to any pull request head (see copilot-instructions.md).
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.AZURE_REGISTRY_URL }}
  API_IMAGE: ${{ vars.AZURE_REGISTRY_URL }}/hardwarestore-api
  WEB_IMAGE: ${{ vars.AZURE_REGISTRY_URL }}/hardwarestore-web

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/HardwareStore.Api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: src/HardwareStore.Web
          file: src/HardwareStore.Web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.WEB_IMAGE }}:latest

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions: {}
    environment:
      name: develop
      url: https://hardwarestore-develop-web.happysand-3d660167.westus3.azurecontainerapps.io
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Container App
        env:
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          az containerapp registry set \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --server ${{ vars.AZURE_REGISTRY_URL }} \
            --username ${{ vars.AZURE_REGISTRY_USERNAME }} \
            --password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

          az containerapp secret set \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --secrets \
              cosmos-connection-string="$COSMOS_CONNECTION_STRING" \
              jwt-key="$JWT_KEY" \
              serp-api-key="$SERP_API_KEY"

          az containerapp update \
            --name ${{ vars.AZURE_API_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              CosmosDb__ConnectionString=secretref:cosmos-connection-string \
              CosmosDb__DatabaseName=HardwareStore \
              CosmosDb__ContainerName=Documents \
              CosmosDb__AllowInsecure=false \
              Jwt__Key=secretref:jwt-key \
              Jwt__Issuer=HardwareStore \
              Jwt__Audience=HardwareStoreUsers \
              ASPNETCORE_URLS=http://+:5000 \
              RetailerClients__UseSerpApi=true \
              SerpApi__ApiKey=secretref:serp-api-key

      - name: Deploy Web Container App
        run: |
          az containerapp registry set \
            --name ${{ vars.AZURE_WEB_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --server ${{ vars.AZURE_REGISTRY_URL }} \
            --username ${{ vars.AZURE_REGISTRY_USERNAME }} \
            --password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

          az containerapp update \
            --name ${{ vars.AZURE_WEB_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.WEB_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              VITE_API_URL=https://hardwarestore-develop-api.happysand-3d660167.westus3.azurecontainerapps.io

      - name: Verify deployment
        run: |
          echo "Deployment complete."
          echo "API: https://hardwarestore-develop-api.happysand-3d660167.westus3.azurecontainerapps.io"
          echo "Web: https://hardwarestore-develop-web.happysand-3d660167.westus3.azurecontainerapps.io"
