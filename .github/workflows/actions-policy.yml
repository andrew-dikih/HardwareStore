name: Actions Policy - Lint and Boundary Tests

# Validates .github/** itself: workflow YAML lint (actionlint) and the
# deterministic docs-only boundary harness (.github/scripts). This workflow
# intentionally has NO paths-ignore — changes under .github/** are, by
# definition, automation-required (see .github/DOCS_ONLY_CI_POLICY.md).
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.github/**'
  workflow_dispatch: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  docs-only-boundary-tests:
    name: Docs-Only Boundary Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run boundary classification tests
        run: python -m unittest discover -s .github/scripts/tests -v
